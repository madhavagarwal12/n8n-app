name: Build Android App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Pre-build Complete n8n ARM64 Rootfs
        run: |
          mkdir -p app/src/main/assets
          echo "Pulling official n8n ARM64 Alpine image with pre-compiled isolated-vm and native modules..."
          docker create --platform linux/arm64 --name n8n_container docker.io/n8nio/n8n:latest
          echo "Exporting pre-built rootfs to app/src/main/assets/n8n-rootfs-arm64.tar.xz..."
          docker export n8n_container | xz -6e -T0 > app/src/main/assets/n8n-rootfs-arm64.tar.xz
          docker rm n8n_container
          echo "Generated asset size:"
          ls -lh app/src/main/assets/

      - name: Grant Execute Permissions
        run: |
          chmod +x gradlew || true
          chmod +x scripts/*.sh || true

      - name: Build with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: n8n-android-server-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
