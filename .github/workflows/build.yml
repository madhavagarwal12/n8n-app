name: Build Android App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Prepare Rootfs Assets
        run: |
          mkdir -p app/src/main/assets
          echo "Downloading Alpine ARM64 rootfs payload..."
          curl -fsSL "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.0-aarch64.tar.gz" -o "app/src/main/assets/n8n-rootfs-arm64.tar.gz"
          ls -lh app/src/main/assets/

      - name: Grant Execute Permissions
        run: |
          chmod +x gradlew || true
          chmod +x scripts/*.sh || true

      - name: Build with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: n8n-android-server-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
