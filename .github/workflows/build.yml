name: Build Android App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Pre-build Complete n8n ARM64 Rootfs
        run: |
          mkdir -p app/src/main/assets
          echo "Building complete pre-installed n8n ARM64 rootfs in Docker container..."
          docker run --platform linux/arm64 --name n8n_builder alpine:3.21 /bin/sh -c "
            apk update && \
            apk add --no-cache nodejs npm sqlite ca-certificates bash python3 make g++ && \
            npm install -g n8n@2.40.6 --prefer-online --omit=dev --no-audit --no-fund && \
            mkdir -p /root/.n8n /tmp && \
            rm -rf /root/.npm /var/cache/apk/* /tmp/*
          "
          echo "Exporting and compressing pre-built rootfs to app/src/main/assets/n8n-rootfs-arm64.tar.xz..."
          docker export n8n_builder | xz -6e -T0 > app/src/main/assets/n8n-rootfs-arm64.tar.xz
          docker rm n8n_builder
          echo "Generated asset size:"
          ls -lh app/src/main/assets/

      - name: Grant Execute Permissions
        run: |
          chmod +x gradlew || true
          chmod +x scripts/*.sh || true

      - name: Build with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: n8n-android-server-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
