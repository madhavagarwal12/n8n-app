name: Build Android App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Pre-build Complete n8n ARM64 Rootfs
        run: |
          mkdir -p app/src/main/assets
          echo "Verifying official n8n ARM64 container filesystem..."
          docker run --rm --platform linux/arm64 --entrypoint /bin/sh docker.io/n8nio/n8n:latest -c "
            which node && echo 'NODE_OK' && \
            (which n8n || find /usr /home /bin -name n8n 2>/dev/null) && echo 'N8N_FOUND' && \
            n8n --version && echo 'N8N_VERSION_OK' && \
            (find / -name '*isolated_vm*.node' -o -name '*isolated-vm*.node' 2>/dev/null | head -n 1) && echo 'ISOLATED_VM_PRESENT' && \
            (find / -name '*sqlite3*.node' 2>/dev/null | head -n 1) && echo 'SQLITE3_PRESENT'
          "

          echo "Exporting pre-built rootfs..."
          docker create --platform linux/arm64 --name n8n_container docker.io/n8nio/n8n:latest
          docker export n8n_container | xz -6e -T0 > app/src/main/assets/n8n-rootfs-arm64.tar.xz
          docker rm n8n_container

          echo "Validating exported tar.xz archive contents..."
          if ! tar -tJf app/src/main/assets/n8n-rootfs-arm64.tar.xz | grep -E '(^|/)n8n($|/)|node_modules/n8n' | head -n 5; then
            echo "ERROR: n8n was not found in exported rootfs archive!"
            exit 1
          fi
          echo "ROOTFS_ARCHIVE_VALID"
          ls -lh app/src/main/assets/

      - name: Grant Execute Permissions
        run: |
          chmod +x gradlew || true
          chmod +x scripts/*.sh || true

      - name: Build with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: n8n-android-server-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
